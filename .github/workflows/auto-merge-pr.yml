name: Auto-Merge PR on Successful CI

on:
  workflow_run:
    workflows: ["CI - Tests and Coverage"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr view --json number -q .number "${GITHUB_HEAD_REF}" || echo "")
          if [ -z "$PR_NUMBER" ]; then
            # Fallback: find PR from the workflow run
            PR_NUMBER=$(gh api /repos/${{ github.repository }}/pulls --jq ".[] | select(.head.sha==\"${{ github.event.workflow_run.head_sha }}\") | .number" | head -n1)
          fi
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Found PR number: $PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge PR
        if: steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Enable auto-merge
          gh pr merge $PR_NUMBER --auto --squash

          # Wait for the PR to be merged
          echo "Waiting for PR to be merged..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            pr_state=$(gh pr view $PR_NUMBER --json state --jq .state)
            if [ "$pr_state" == "MERGED" ]; then
              echo "PR successfully merged!"
              break
            fi
            echo "PR state: $pr_state, waiting... (attempt $((attempt+1))/$max_attempts)"
            sleep 10
            attempt=$((attempt+1))
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Timeout waiting for PR to merge"
            exit 1
          fi

      - name: Delete branch
        if: success() && steps.pr.outputs.number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get branch name from PR
          BRANCH_NAME=$(gh pr view ${{ steps.pr.outputs.number }} --json headRefName -q .headRefName)
          echo "Deleting branch: $BRANCH_NAME"
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME" || echo "Branch may have been already deleted"
