name: Auto-Merge PR on Successful Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'
          cache-dependency-path: |
            app/backend/package-lock.json
            app/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: app/backend
        run: npm ci

      - name: Build backend
        working-directory: app/backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build-only

      - name: Auto-merge PR
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Enable auto-merge
          gh pr merge $PR_NUMBER --auto --squash

          # Wait for the PR to be merged
          echo "Waiting for PR to be merged..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            pr_state=$(gh pr view $PR_NUMBER --json state --jq .state)
            if [ "$pr_state" == "MERGED" ]; then
              echo "PR successfully merged!"
              break
            fi
            echo "PR state: $pr_state, waiting... (attempt $((attempt+1))/$max_attempts)"
            sleep 10
            attempt=$((attempt+1))
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Timeout waiting for PR to merge"
            exit 1
          fi

      - name: Delete branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.event.pull_request.head.ref }}"
          echo "Deleting branch: $BRANCH_NAME"
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/${{ github.repository }}/git/refs/heads/$BRANCH_NAME" || echo "Branch may have been already deleted"
